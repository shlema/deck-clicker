<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Deck Controller</title>
<style>
  :root {
    --bg: #0e1013; --panel: #16191e; --line: #262b33;
    --text: #d8dce2; --dim: #6b7280;
    --tally: #ff3b30; --tally-glow: rgba(255,59,48,.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    font: 600 13px/1 ui-monospace, monospace; letter-spacing: .04em;
  }
  #tally {
    width: 10px; height: 10px; border-radius: 50%;
    background: #2e343d; flex: none; transition: background .15s, box-shadow .15s;
  }
  #tally.live { background: var(--tally); box-shadow: 0 0 10px 3px var(--tally-glow); }
  #driver { color: var(--dim); font-weight: 400; margin-left: auto; text-align: right; }

  #preview { flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 12px; min-height: 0; }
  #sheet { position: relative; border: 1px solid var(--line); background: #000; }
  #sheet canvas { display: block; }
  #ink { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #ink.armed { pointer-events: auto; cursor: crosshair; touch-action: none;
    -webkit-user-select: none; user-select: none; }

  #pen { font: 600 12px/1 ui-monospace, monospace; letter-spacing: .04em;
    padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--dim); cursor: pointer; }
  #pen.on { color: #0e1013; background: var(--pen); border-color: var(--pen); }

  #counter { text-align: center; font: 600 15px/1 ui-monospace, monospace;
    color: var(--dim); padding-bottom: 6px; }
  #counter b { color: var(--text); }

  #transport { display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    padding: 0 12px 10px; }
  #transport button {
    height: 84px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--text); font-size: 30px;
    cursor: pointer; touch-action: manipulation;
  }
  #transport button:active { background: #1f242c; }

  #thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 14px; flex: none; }
  #thumbs canvas { height: 64px; border: 1px solid var(--line); border-radius: 4px;
    cursor: pointer; flex: none; background: #000; }
  #thumbs canvas.active { border-color: var(--tally); }

  #conn { position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; font-size: 12px; color: var(--dim); display: none; }
</style>
</head>
<body>
<header>
  <div id="tally"></div>
  <span id="roomLabel"></span>
  <span id="driver"></span>
  <button id="pen" aria-pressed="false">✎ DRAW</button>
</header>
<div id="preview"><div id="sheet"><canvas id="main"></canvas><canvas id="ink"></canvas></div></div>
<div id="counter">— / —</div>
<div id="transport">
  <button id="prev" aria-label="Previous page">‹</button>
  <button id="next" aria-label="Next page">›</button>
</div>
<div id="thumbs"></div>
<div id="conn">connecting…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ── EDIT THESE TWO LINES ─────────────────────────────────────
const SUPABASE_URL = "https://ltmoomstlyyzsdmvydqr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0bW9vbXN0bHl5enNkbXZ5ZHFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1ODI4NzksImV4cCI6MjA5OTE1ODg3OX0.xt9sA-h009_ITyoiUKNn9Hqj2nDz8qor5zlQ6wuKowU";
// ─────────────────────────────────────────────────────────────
// Usage: controller.html?room=webinar1&pdf=https://host/deck.pdf&name=Andrii

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const params = new URLSearchParams(location.search);
const room = params.get("room") || "default";
const pdfUrl = params.get("pdf");
let myName = params.get("name") || localStorage.getItem("deckName");
if (!myName) {
  myName = prompt("Your name (shown to co-presenters):") || "presenter";
  localStorage.setItem("deckName", myName);
}

document.getElementById("roomLabel").textContent = "ROOM " + room.toUpperCase();
const connEl = document.getElementById("conn");
connEl.style.display = "block";

const mainCanvas = document.getElementById("main");
const mainCtx = mainCanvas.getContext("2d");
const counterEl = document.getElementById("counter");
const driverEl = document.getElementById("driver");
const tallyEl = document.getElementById("tally");
const thumbsEl = document.getElementById("thumbs");

let pdfDoc = null, currentPage = 1, renderTask = null, tallyTimer = null;

// ── Ink overlay: fading strokes, coordinates normalized 0..1 ──
const INK_HOLD = 2500, INK_FADE = 1000;   // ms visible, then ms fading out
const inkCanvas = document.getElementById("ink");
const inkCtx = inkCanvas.getContext("2d");
const strokes = new Map();                // id -> { color, pts, t }
let inkRaf = null;

function drawInk() {
  inkRaf = null;
  const now = performance.now();
  const w = inkCanvas.width, h = inkCanvas.height, lw = h * 0.006;
  inkCtx.clearRect(0, 0, w, h);
  inkCtx.lineCap = inkCtx.lineJoin = "round";
  for (const [id, s] of strokes) {
    const age = now - s.t;
    if (age > INK_HOLD + INK_FADE) { strokes.delete(id); continue; }
    const alpha = age < INK_HOLD ? 1 : 1 - (age - INK_HOLD) / INK_FADE;
    inkCtx.beginPath();
    s.pts.forEach(([x, y], i) => i ? inkCtx.lineTo(x * w, y * h) : inkCtx.moveTo(x * w, y * h));
    if (s.pts.length === 1) inkCtx.lineTo(s.pts[0][0] * w + 0.01, s.pts[0][1] * h);
    // dark halo first so ink reads on both light and dark slides
    inkCtx.globalAlpha = alpha * 0.35; inkCtx.strokeStyle = "#000"; inkCtx.lineWidth = lw * 1.8;
    inkCtx.stroke();
    inkCtx.globalAlpha = alpha; inkCtx.strokeStyle = s.color; inkCtx.lineWidth = lw;
    inkCtx.stroke();
  }
  inkCtx.globalAlpha = 1;
  if (strokes.size) inkRaf = requestAnimationFrame(drawInk);
}
function scheduleInk() { if (!inkRaf) inkRaf = requestAnimationFrame(drawInk); }
function addInk({ id, color, pts }) {
  let s = strokes.get(id);
  if (!s) strokes.set(id, s = { color, pts: [] });
  s.pts.push(...pts);
  s.t = performance.now();
  scheduleInk();
}
function clearInk() { strokes.clear(); scheduleInk(); }
function sizeInk(vp) {
  inkCanvas.width = vp.width; inkCanvas.height = vp.height;   // also clears; redraw
  scheduleInk();
}

async function renderMain(n) {
  const page = await pdfDoc.getPage(n);
  const dpr = window.devicePixelRatio || 1;
  const box = document.getElementById("preview");
  const base = page.getViewport({ scale: 1 });
  const scale = Math.min(
    (box.clientWidth - 24) / base.width,
    (box.clientHeight - 24) / base.height
  ) * dpr;
  const vp = page.getViewport({ scale });
  mainCanvas.width = vp.width; mainCanvas.height = vp.height;
  mainCanvas.style.width = vp.width / dpr + "px";
  mainCanvas.style.height = vp.height / dpr + "px";
  sizeInk(vp);
  if (renderTask) renderTask.cancel();
  renderTask = page.render({ canvasContext: mainCtx, viewport: vp });
  try { await renderTask.promise; } catch (e) {}
}

function setPage(n, who) {
  if (!pdfDoc) return;
  n = Math.max(1, Math.min(n, pdfDoc.numPages));
  if (n !== currentPage) clearInk();
  currentPage = n;
  renderMain(n);
  counterEl.innerHTML = "<b>" + n + "</b> / " + pdfDoc.numPages;
  [...thumbsEl.children].forEach((c, i) => c.classList.toggle("active", i + 1 === n));
  thumbsEl.children[n - 1]?.scrollIntoView({ inline: "center", behavior: "smooth" });
  if (who) {
    driverEl.textContent = who === myName ? "you're driving" : who + " is driving";
    tallyEl.classList.toggle("live", who === myName);
    clearTimeout(tallyTimer);
    tallyTimer = setTimeout(() => tallyEl.classList.remove("live"), 5000);
  }
}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY,
  { realtime: { params: { eventsPerSecond: 30 } } });
const channel = sb.channel("deck:" + room, { config: { broadcast: { self: false } } });

function go(n) {
  endStroke();
  setPage(n, myName);
  channel.send({ type: "broadcast", event: "goto",
    payload: { page: currentPage, who: myName } });
}

channel
  .on("broadcast", { event: "goto" }, ({ payload }) => setPage(payload.page, payload.who))
  .on("broadcast", { event: "ink" }, ({ payload }) => {
    if (payload.page === currentPage) addInk(payload);
  })
  .on("broadcast", { event: "sync-request" }, () => {
    // any controller answers; identical answers are harmless
    channel.send({ type: "broadcast", event: "goto",
      payload: { page: currentPage, who: driverEl.textContent ? undefined : myName } });
  })
  .subscribe(async (state) => {
    if (state !== "SUBSCRIBED") return;
    connEl.style.display = "none";
    if (!pdfUrl) { connEl.textContent = "missing ?pdf= parameter"; connEl.style.display = "block"; return; }
    pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
    await buildThumbs();
    setPage(1);
    channel.send({ type: "broadcast", event: "sync-request", payload: {} });
  });

async function buildThumbs() {
  for (let i = 1; i <= pdfDoc.numPages; i++) {
    const page = await pdfDoc.getPage(i);
    const vp = page.getViewport({ scale: 128 / page.getViewport({ scale: 1 }).height });
    const c = document.createElement("canvas");
    c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    c.onclick = () => go(i);
    thumbsEl.appendChild(c);
  }
}

// ── Drawing: one color per presenter, points batched to stay under rate limits ──
const INK_SEND_MS = 60;
const myColor = "hsl(" + [...myName].reduce((h, ch) => (h * 31 + ch.codePointAt(0)) >>> 0, 7) % 360 + " 95% 58%)";
document.documentElement.style.setProperty("--pen", myColor);
const penBtn = document.getElementById("pen");
let penOn = false, myStroke = null, pending = [], flushTimer = null, strokeSeq = 0;

function setPen(on) {
  penOn = on;
  penBtn.classList.toggle("on", on);
  penBtn.setAttribute("aria-pressed", on);
  inkCanvas.classList.toggle("armed", on);
  if (!on) endStroke();
}
penBtn.onclick = () => setPen(!penOn);

function flushInk() {
  clearTimeout(flushTimer); flushTimer = null;
  if (!pending.length) return;
  channel.send({ type: "broadcast", event: "ink",
    payload: { page: currentPage, id: myStroke, color: myColor, pts: pending } });
  pending = [];
}
function inkPoint(e) {
  const r = inkCanvas.getBoundingClientRect();
  const p = [+((e.clientX - r.left) / r.width).toFixed(4), +((e.clientY - r.top) / r.height).toFixed(4)];
  addInk({ id: myStroke, color: myColor, pts: [p] });
  pending.push(p);
  if (!flushTimer) flushTimer = setTimeout(flushInk, INK_SEND_MS);
}
function endStroke() {
  if (!myStroke) return;
  flushInk();
  myStroke = null;
}
inkCanvas.addEventListener("pointerdown", (e) => {
  if (!penOn || !pdfDoc || e.button !== 0) return;
  e.preventDefault();
  inkCanvas.setPointerCapture(e.pointerId);
  endStroke();
  myStroke = myName + ":" + Date.now().toString(36) + ":" + strokeSeq++;
  inkPoint(e);
});
inkCanvas.addEventListener("pointermove", (e) => { if (myStroke) inkPoint(e); });
inkCanvas.addEventListener("pointerup", endStroke);
inkCanvas.addEventListener("pointercancel", endStroke);

document.getElementById("prev").onclick = () => go(currentPage - 1);
document.getElementById("next").onclick = () => go(currentPage + 1);
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") go(currentPage + 1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") go(currentPage - 1);
  if (e.key === "d" || e.key === "D") setPen(!penOn);
});
</script>
</body>
</html>
