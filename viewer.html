<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deck Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; }
  #sheet { position: relative; }
  #sheet canvas { display: block; }
  #ink { position: absolute; inset: 0; width: 100%; height: 100%; }
  #status {
    position: fixed; bottom: 12px; right: 16px;
    font: 12px/1 ui-monospace, monospace; color: #444;
    opacity: 1; transition: opacity 2s;
  }
</style>
</head>
<body>
<div id="stage"><div id="sheet"><canvas id="pdf"></canvas><canvas id="ink"></canvas></div></div>
<div id="status">connecting…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ── EDIT THESE TWO LINES ─────────────────────────────────────
const SUPABASE_URL = "https://ltmoomstlyyzsdmvydqr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0bW9vbXN0bHl5enNkbXZ5ZHFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1ODI4NzksImV4cCI6MjA5OTE1ODg3OX0.xt9sA-h009_ITyoiUKNn9Hqj2nDz8qor5zlQ6wuKowU";
// ─────────────────────────────────────────────────────────────
// Usage: viewer.html?room=webinar1&pdf=https://host/deck.pdf
// The PDF URL must allow CORS (a public Supabase Storage bucket works).

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const params = new URLSearchParams(location.search);
const room = params.get("room") || "default";
const pdfUrl = params.get("pdf");
const statusEl = document.getElementById("status");
const canvas = document.getElementById("pdf");
const ctx = canvas.getContext("2d");

let pdfDoc = null;
let currentPage = 1;
let renderTask = null;

// ── Ink overlay: fading strokes, coordinates normalized 0..1 ──
const INK_HOLD = 2500, INK_FADE = 1000;   // ms visible, then ms fading out
const inkCanvas = document.getElementById("ink");
const inkCtx = inkCanvas.getContext("2d");
const strokes = new Map();                // id -> { color, pts, t }
let inkRaf = null;

function drawInk() {
  inkRaf = null;
  const now = performance.now();
  const w = inkCanvas.width, h = inkCanvas.height, lw = h * 0.006;
  inkCtx.clearRect(0, 0, w, h);
  inkCtx.lineCap = inkCtx.lineJoin = "round";
  for (const [id, s] of strokes) {
    const age = now - s.t;
    if (age > INK_HOLD + INK_FADE) { strokes.delete(id); continue; }
    const alpha = age < INK_HOLD ? 1 : 1 - (age - INK_HOLD) / INK_FADE;
    inkCtx.beginPath();
    s.pts.forEach(([x, y], i) => i ? inkCtx.lineTo(x * w, y * h) : inkCtx.moveTo(x * w, y * h));
    if (s.pts.length === 1) inkCtx.lineTo(s.pts[0][0] * w + 0.01, s.pts[0][1] * h);
    // dark halo first so ink reads on both light and dark slides
    inkCtx.globalAlpha = alpha * 0.35; inkCtx.strokeStyle = "#000"; inkCtx.lineWidth = lw * 1.8;
    inkCtx.stroke();
    inkCtx.globalAlpha = alpha; inkCtx.strokeStyle = s.color; inkCtx.lineWidth = lw;
    inkCtx.stroke();
  }
  inkCtx.globalAlpha = 1;
  if (strokes.size) inkRaf = requestAnimationFrame(drawInk);
}
function scheduleInk() { if (!inkRaf) inkRaf = requestAnimationFrame(drawInk); }
function addInk({ id, color, pts }) {
  let s = strokes.get(id);
  if (!s) strokes.set(id, s = { color, pts: [] });
  s.pts.push(...pts);
  s.t = performance.now();
  scheduleInk();
}
function clearInk() { strokes.clear(); scheduleInk(); }
function sizeInk(vp) {
  inkCanvas.width = vp.width; inkCanvas.height = vp.height;   // also clears; redraw
  scheduleInk();
}

async function renderPage(n) {
  if (!pdfDoc) return;
  n = Math.max(1, Math.min(n, pdfDoc.numPages));
  if (n !== currentPage) clearInk();
  currentPage = n;
  const page = await pdfDoc.getPage(n);
  const dpr = window.devicePixelRatio || 1;
  const base = page.getViewport({ scale: 1 });
  const scale = Math.min(innerWidth / base.width, innerHeight / base.height) * dpr;
  const vp = page.getViewport({ scale });
  canvas.width = vp.width;
  canvas.height = vp.height;
  canvas.style.width = vp.width / dpr + "px";
  canvas.style.height = vp.height / dpr + "px";
  sizeInk(vp);
  if (renderTask) renderTask.cancel();
  renderTask = page.render({ canvasContext: ctx, viewport: vp });
  try { await renderTask.promise; } catch (e) { /* cancelled mid-render */ }
}

addEventListener("resize", () => renderPage(currentPage));

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const channel = sb.channel("deck:" + room, { config: { broadcast: { self: false } } });

channel
  .on("broadcast", { event: "goto" }, ({ payload }) => {
    renderPage(payload.page);
    statusEl.textContent = "";
  })
  .on("broadcast", { event: "ink" }, ({ payload }) => {
    if (payload.page === currentPage) addInk(payload);
  })
  .subscribe(async (state) => {
    if (state !== "SUBSCRIBED") return;
    statusEl.textContent = "connected · waiting for controller";
    setTimeout(() => statusEl.style.opacity = 0, 4000);
    if (!pdfUrl) { statusEl.textContent = "missing ?pdf= parameter"; return; }
    pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
    await renderPage(1);
    // ask any live controller where we are
    channel.send({ type: "broadcast", event: "sync-request", payload: {} });
  });
</script>
</body>
</html>
