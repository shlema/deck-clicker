<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deck Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; }
  #status {
    position: fixed; bottom: 12px; right: 16px;
    font: 12px/1 ui-monospace, monospace; color: #444;
    opacity: 1; transition: opacity 2s;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="pdf"></canvas></div>
<div id="status">connecting…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ── EDIT THESE TWO LINES ─────────────────────────────────────
const SUPABASE_URL = "https://ltmoomstlyyzsdmvydqr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0bW9vbXN0bHl5enNkbXZ5ZHFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1ODI4NzksImV4cCI6MjA5OTE1ODg3OX0.xt9sA-h009_ITyoiUKNn9Hqj2nDz8qor5zlQ6wuKowU";
// ─────────────────────────────────────────────────────────────
// Usage: viewer.html?room=webinar1&pdf=https://host/deck.pdf
// The PDF URL must allow CORS (a public Supabase Storage bucket works).

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const params = new URLSearchParams(location.search);
const room = params.get("room") || "default";
const pdfUrl = params.get("pdf");
const statusEl = document.getElementById("status");
const canvas = document.getElementById("pdf");
const ctx = canvas.getContext("2d");

let pdfDoc = null;
let currentPage = 1;
let renderTask = null;

async function renderPage(n) {
  if (!pdfDoc) return;
  n = Math.max(1, Math.min(n, pdfDoc.numPages));
  currentPage = n;
  const page = await pdfDoc.getPage(n);
  const dpr = window.devicePixelRatio || 1;
  const base = page.getViewport({ scale: 1 });
  const scale = Math.min(innerWidth / base.width, innerHeight / base.height) * dpr;
  const vp = page.getViewport({ scale });
  canvas.width = vp.width;
  canvas.height = vp.height;
  canvas.style.width = vp.width / dpr + "px";
  canvas.style.height = vp.height / dpr + "px";
  if (renderTask) renderTask.cancel();
  renderTask = page.render({ canvasContext: ctx, viewport: vp });
  try { await renderTask.promise; } catch (e) { /* cancelled mid-render */ }
}

addEventListener("resize", () => renderPage(currentPage));

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const channel = sb.channel("deck:" + room, { config: { broadcast: { self: false } } });

channel
  .on("broadcast", { event: "goto" }, ({ payload }) => {
    renderPage(payload.page);
    statusEl.textContent = "";
  })
  .subscribe(async (state) => {
    if (state !== "SUBSCRIBED") return;
    statusEl.textContent = "connected · waiting for controller";
    setTimeout(() => statusEl.style.opacity = 0, 4000);
    if (!pdfUrl) { statusEl.textContent = "missing ?pdf= parameter"; return; }
    pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
    await renderPage(1);
    // ask any live controller where we are
    channel.send({ type: "broadcast", event: "sync-request", payload: {} });
  });
</script>
</body>
</html>
